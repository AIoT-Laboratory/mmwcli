name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Release must run from an X.Y tag ref." >&2
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${GITHUB_REF_NAME}.0" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            goos: linux
            goarch: amd64
            suffix: ""
            tags: ""
            smoke: true
          - id: linux-arm64
            goos: linux
            goarch: arm64
            suffix: ""
            tags: ""
            smoke: false
          - id: windows-amd64
            goos: windows
            goarch: amd64
            suffix: .exe
            tags: ""
            smoke: false
          - id: windows-arm64
            goos: windows
            goarch: arm64
            suffix: .exe
            tags: ""
            smoke: false
          - id: windows-amd64-ftd2xx
            goos: windows
            goarch: amd64
            suffix: .exe
            tags: ftd2xx
            smoke: false
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      BUILD_TAGS: ${{ matrix.tags }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ASSET_NAME: mmwcli-${{ needs.prepare.outputs.tag }}-${{ matrix.id }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          args=(build -trimpath -ldflags "-X=mmwcli/internal/app.Version=${RELEASE_VERSION}")
          if [[ -n "${BUILD_TAGS}" ]]; then
            args+=(-tags "${BUILD_TAGS}")
          fi
          args+=(-o "dist/${ASSET_NAME}" ./cmd/mmwcli)
          go "${args[@]}"
      - name: Smoke-test Linux amd64 version
        if: ${{ matrix.smoke }}
        shell: bash
        run: |
          set -euo pipefail
          output=$("dist/${ASSET_NAME}" version)
          expected="mmwcli ${RELEASE_VERSION} (linux/amd64)"
          if [[ "${output}" != "${expected}" || "${output}" == *dev* ]]; then
            echo "Version smoke test failed: got '${output}', want '${expected}'." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.id }}
          path: dist/${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 LICENSE release/LICENSE
          install -m 0644 THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          install -m 0755 scripts/download-mmwcli.sh release/download-mmwcli.sh
          install -m 0644 scripts/download-mmwcli.ps1 release/download-mmwcli.ps1
          (
            cd release
            mapfile -d '' assets < <(
              find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z
            )
            if (( ${#assets[@]} == 0 )); then
              echo "Release contains no assets." >&2
              exit 1
            fi
            sha256sum "${assets[@]}" > SHA256SUMS
          )
      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release/* \
            --verify-tag \
            --title "mmwcli ${RELEASE_TAG}" \
            --generate-notes
