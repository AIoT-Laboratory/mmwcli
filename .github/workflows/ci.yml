name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l cmd internal
          if ($files) {
            $files
            exit 1
          }
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin\mmwcli.exe .\cmd\mmwcli
