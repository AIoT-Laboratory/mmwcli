name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install FFmpeg image2pipe integration fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -version
      - run: make check

  windows-test:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...
      - run: go test -count=1 -tags ftd2xx ./...
      - run: go build -trimpath -tags ftd2xx ./cmd/mmwcli

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - windows
          - linux
        goarch:
          - amd64
          - arm64
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: make build
