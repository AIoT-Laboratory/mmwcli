% mmwcli xWR16xx family debug-cli raw-only profile
% The host translates this CFG to mmWaveLink; it is not sent to a device text CLI.
% 100 finite frames, 16-bit complex ADC, four RX, TX0/TX1 TDM, two-lane HW LVDS.
% xWR16xx uses the 77 GHz band, TX mask 0x3, and low-power ADC mode 1.

flushCfg
dfeDataOutputMode 1
channelCfg 15 3 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1
profileCfg 0 77 7 3 24 0 0 50 1 256 12500 0 0 94
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
frameCfg 0 1 32 100 100 1 0
lowPower 0 1
lvdsStreamCfg -1 0 1 0
