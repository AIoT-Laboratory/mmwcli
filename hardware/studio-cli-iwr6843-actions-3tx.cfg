% OpenMMW dataset/actions IWR6843 ISK three-TX acquisition profile
% Physical profile and frame values reproduce the retained mmWave Studio capture log.
% Use with OpenMMW openmmw/configs/radar_products/iwr6843_actions.yaml.
% 600 finite frames at 100 ms, 256 samples, 128 loops, TX0/TX1/TX2 TDM, four RX.
% This file controls acquisition only; the OpenMMW preset supplies the ISK board geometry.

flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1
profileCfg 0 60 7 6 65 0 0 60.012 0 256 4400 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 128 600 100 1 0
lowPower 0 0
lvdsStreamCfg -1 0 1 0
sensorStart
