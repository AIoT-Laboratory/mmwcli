% mmwcli xWR6843 ES2 debug-capture raw-only profile
% SOP2 only. The host translates this CFG to mmWaveLink; it is not sent to a device CLI.
% BSS/MSS firmware is loaded through Enhanced COM, then D2XX A/B carries SPI/IRQ control.
% RF baseline parameters follow TI's documented xWR68xx interfaces; TI devices only.
% See THIRD_PARTY_NOTICES.md. This is not TI's monitor-enabled profile_monitor_xwr68xx.cfg.
% 100 finite frames, 16-bit complex ADC, four RX, two TDM TX chirps, two-lane HW LVDS.
% RF monitor commands are intentionally absent because mmwcli does not consume monitor UART reports.

flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1
profileCfg 0 60 7 3 24 0 0 166 1 256 12500 0 0 158
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 4
frameCfg 0 1 32 100 100 1 0
lowPower 0 0
lvdsStreamCfg -1 0 1 0
