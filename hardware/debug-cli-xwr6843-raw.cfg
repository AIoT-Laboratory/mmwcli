% mmwcli xWR6843 ES2 debug-cli raw-only synchronized-capture profile
% SOP2 only. The host translates this CFG to mmWaveLink; it is not sent to a device CLI.
% BSS/MSS firmware is loaded through Enhanced COM, then D2XX A/B carries SPI/IRQ control.
% Acquisition fields mirror xwr68xx_sync_capture.lua; camera/control settings are external.
% See THIRD_PARTY_NOTICES.md. This is not TI's monitor-enabled profile_monitor_xwr68xx.cfg.
% 600 finite frames at 100 ms, 256 samples, 128 loops, TX0/TX1/TX2 TDM, four RX.
% 16-bit complex ADC uses the two-lane group2_i_then_q raw layout.
% RF monitor commands are intentionally absent because mmwcli does not consume monitor UART reports.

flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1
profileCfg 0 60 7 6 65 0 0 60.012 0 256 4400 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 128 600 100 1 0
lowPower 0 0
lvdsStreamCfg -1 0 1 0
